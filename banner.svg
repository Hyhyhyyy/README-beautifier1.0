<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="README-beautifier" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#2e1d52"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <circle cx="960" cy="190" r="152" fill="#a78bfa" opacity="0.07"/>
  <circle cx="960" cy="190" r="152" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.18"/>
  <rect x="-220" y="0" width="220" height="380" fill="url(#beam)">
    <animate attributeName="x" values="-220;1300;-220" dur="7.5s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(960,190)">
    <circle r="118" fill="#120a24" stroke="#a78bfa" stroke-width="8"/>
    <path d="M0,-72 C8,-20 20,-8 72,0 C20,8 8,20 0,72 C-8,20 -20,8 -72,0 C-20,-8 -8,-20 0,-72 Z" fill="#a78bfa" stroke="#f0abfc" stroke-width="6"/>
    <circle r="14" fill="#f0abfc"/>
  </g>
  <g transform="translate(370,138)">
    <circle r="10" fill="#f0abfc">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      <circle cx="56" cy="0" r="9" fill="#c4b5fd"/>
    </g>
  </g>
  <text x="70" y="150" font-size="54" font-weight="800" fill="url(#title)">README-beautifier</text>
  <text x="72" y="198" font-size="22" fill="#d9cdff" opacity="0.9">README 一键美化落地页</text>
  <g font-size="16" font-weight="600">
    <rect x="72" y="220" width="120" height="34" rx="17" fill="#a78bfa" opacity="0.18" stroke="#c4b5fd" stroke-width="2"/>
    <text x="132" y="242" fill="#e3daff" text-anchor="middle">横幅</text>
    <rect x="204" y="220" width="120" height="34" rx="17" fill="#f0abfc" opacity="0.16" stroke="#f0abfc" stroke-width="2"/>
    <text x="264" y="242" fill="#fce2fe" text-anchor="middle">架构图</text>
  </g>
</svg>
